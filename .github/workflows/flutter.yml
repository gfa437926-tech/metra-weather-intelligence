name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: deno check --no-lock supabase/functions/station-directory/index.ts
      - name: Test Supabase Edge Function permission rules
        run: deno test --no-check supabase/functions/station-directory/permissions_test.ts
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze application source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build web release
        run: flutter build web --release
      - name: Upload web release
        uses: actions/upload-artifact@v4
        with:
          name: metra-web-release
          path: build/web
          if-no-files-found: error
          retention-days: 14
